<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi fournisseurs SICAAP</title>
<style>
:root{
  --abysse:#015959;
  --abysse-clair:#0A7472;
  --turquoise:#57CBBB;
  --orange:#F8AC16;
  --retard:#A33327;
  --fond:#F3F5F4;
  --surface:#FFFFFF;
  --encre:#16302E;
  --encre-doux:#5C6F6C;
  --trait:#DCE3E1;
  --titre:'Century Gothic','URW Gothic','Questrial','Futura','Trebuchet MS',sans-serif;
  --corps:'Calibri','Carlito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fond);color:var(--encre);
  font-family:var(--corps);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.f-titre{font-family:var(--titre);font-weight:700;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--abysse)}

/* ---------- connexion ---------- */
#connexion{min-height:100vh;display:grid;place-items:center;padding:24px}
.carte-connexion{
  background:var(--surface);width:100%;max-width:380px;
  border:1px solid var(--trait);border-radius:4px;padding:32px;
}
.carte-connexion h1{font-size:24px;color:var(--abysse);margin-bottom:4px}
.carte-connexion p{color:var(--encre-doux);margin:0 0 24px;font-size:15px}

/* ---------- ossature ---------- */
header{
  background:var(--abysse);color:#fff;
  padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
header h1{font-size:19px;flex:1;min-width:180px}
header .id{font-size:14px;opacity:.75}
nav{
  background:var(--surface);border-bottom:1px solid var(--trait);
  display:flex;gap:2px;padding:0 12px;overflow-x:auto;
  position:sticky;top:0;z-index:20;
}
nav button{
  background:none;border:none;border-bottom:3px solid transparent;
  padding:13px 16px;cursor:pointer;white-space:nowrap;
  font-family:var(--titre);font-size:15px;color:var(--encre-doux);
}
nav button:hover{color:var(--encre)}
nav button[aria-current="page"]{color:var(--abysse);border-bottom-color:var(--orange)}
main{max-width:1080px;margin:0 auto;padding:24px 20px 64px}

/* ---------- boutons ---------- */
.btn{
  background:var(--abysse);color:#fff;border:1px solid var(--abysse);
  border-radius:3px;padding:9px 16px;cursor:pointer;font-family:var(--titre);font-size:15px;
}
.btn:hover{background:var(--abysse-clair);border-color:var(--abysse-clair)}
.btn.creux{background:none;color:var(--abysse)}
.btn.creux:hover{background:#E8F0EE;color:var(--abysse)}
.btn.mini{padding:5px 11px;font-size:14px}
.btn.danger{background:none;color:var(--retard);border-color:#E3C4C0}
.btn.danger:hover{background:#FBEFED}
button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- compteurs ---------- */
.compteurs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.compteur{
  background:var(--surface);border:1px solid var(--trait);border-radius:3px;
  padding:12px 18px;min-width:132px;flex:1;
}
.compteur .n{font-family:var(--titre);font-size:28px;font-weight:700;line-height:1.1;display:block}
.compteur .l{font-size:14px;color:var(--encre-doux)}
.compteur.retard{border-left:4px solid var(--retard)}
.compteur.retard .n{color:var(--retard)}
.compteur.surveiller{border-left:4px solid var(--orange)}
.compteur.actions{border-left:4px solid var(--turquoise)}
.compteur.diffusion{border-left:4px solid var(--abysse)}

/* ---------- listes ---------- */
.bloc-titre{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:0 0 12px;
}
.bloc-titre h2{font-size:19px;color:var(--abysse)}
.bloc-titre .compte{color:var(--encre-doux);font-size:15px}
.liste{background:var(--surface);border:1px solid var(--trait);border-radius:3px}
.ligne{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--trait);
  border-left:4px solid transparent;cursor:pointer;
}
.ligne:last-child{border-bottom:none}
.ligne:hover{background:#F7FAF9}
.ligne.retard{border-left-color:var(--retard)}
.ligne.surveiller{border-left-color:var(--orange)}
.ligne.sans-tarif{border-left-color:#B9C4C1}
.ligne .principal{flex:1;min-width:190px}
.ligne .nom{font-family:var(--titre);font-weight:700}
.ligne .meta{font-size:14px;color:var(--encre-doux)}
.ligne .verdict{font-size:14px;text-align:right;min-width:150px}
.ligne .verdict strong{display:block;font-family:var(--titre)}
.verdict.retard strong{color:var(--retard)}
.verdict.surveiller strong{color:#8A5D00}
.vide{padding:26px 16px;color:var(--encre-doux);background:var(--surface);
  border:1px solid var(--trait);border-radius:3px}

.filtres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filtres input,.filtres select{
  padding:9px 11px;border:1px solid var(--trait);border-radius:3px;background:var(--surface);
}
.filtres input{flex:1;min-width:190px}

/* ---------- fiche ---------- */
.entete-fiche{
  background:var(--surface);border:1px solid var(--trait);border-top:4px solid var(--abysse);
  border-radius:3px;padding:20px;margin-bottom:22px;
}
.entete-fiche h2{font-size:23px;margin-bottom:2px}
.entete-fiche .code{color:var(--encre-doux);font-size:15px;margin-bottom:16px}
.infos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 22px}
.infos div span{display:block;font-size:13px;color:var(--encre-doux)}
.infos div b{font-weight:700;font-family:var(--corps)}
.actions-fiche{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

section.bloc{margin-bottom:30px}

/* chronologie des tarifs */
.chrono{border-left:2px solid var(--trait);margin-left:8px;padding-left:0}
.jalon{position:relative;padding:0 0 18px 24px}
.jalon::before{
  content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;
  border-radius:50%;background:var(--trait);
}
.jalon.vigueur::before{background:var(--turquoise)}
.jalon.venir::before{background:var(--orange)}
.jalon .quand{font-family:var(--titre);font-weight:700}
.jalon .quoi{font-size:15px}
.jalon .note{font-size:14px;color:var(--encre-doux)}
.etiq{
  display:inline-block;font-size:13px;padding:1px 8px;border-radius:2px;
  background:#E8F0EE;color:var(--abysse);margin-left:6px;
}
.etiq.venir{background:#FDF0D4;color:#8A5D00}
.etiq.perime{background:#EEF1F0;color:var(--encre-doux)}
.etiq.faire{background:#FBEFED;color:var(--retard)}

table{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--trait);border-radius:3px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--trait);font-size:15px}
th{font-family:var(--titre);font-size:14px;color:var(--encre-doux);font-weight:700}
tr:last-child td{border-bottom:none}

/* ---------- formulaire modal ---------- */
dialog{
  border:none;border-radius:4px;padding:0;width:min(560px,94vw);
  box-shadow:0 12px 40px rgba(1,89,89,.22);
}
dialog::backdrop{background:rgba(22,48,46,.45)}
dialog .tete{background:var(--abysse);color:#fff;padding:16px 22px;font-family:var(--titre);font-weight:700}
dialog .corps{padding:22px;max-height:66vh;overflow:auto}
dialog .pied{padding:14px 22px;border-top:1px solid var(--trait);display:flex;gap:10px;justify-content:flex-end}
.champ{margin-bottom:15px}
.champ label{display:block;font-size:14px;color:var(--encre-doux);margin-bottom:4px}
.champ input,.champ select,.champ textarea{
  width:100%;padding:9px 11px;border:1px solid var(--trait);border-radius:3px;background:#fff;
}
.champ textarea{min-height:76px;resize:vertical}
.champ .aide{font-size:13px;color:var(--encre-doux);margin-top:4px}

.message{padding:11px 14px;border-radius:3px;margin-bottom:16px;font-size:15px}
.message.erreur{background:#FBEFED;color:var(--retard);border:1px solid #E3C4C0}
.message.ok{background:#E8F5F2;color:var(--abysse);border:1px solid var(--turquoise)}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--encre);color:#fff;padding:11px 20px;border-radius:3px;
  font-size:15px;z-index:60;
}
[hidden]{display:none !important}
@media (max-width:620px){
  main{padding:18px 14px 56px}
  .ligne .verdict{text-align:left;min-width:0}
  .compteur{min-width:44%}
}
@media (prefers-reduced-motion:no-preference){
  #toast{animation:monte .18s ease-out}
  @keyframes monte{from{opacity:0;transform:translate(-50%,10px)}}
}
</style>
</head>
<body>

<!-- ================= CONNEXION ================= -->
<div id="connexion">
  <form class="carte-connexion" id="form-connexion">
    <h1>Suivi fournisseurs</h1>
    <p>SICAAP</p>
    <div id="erreur-connexion" class="message erreur" hidden></div>
    <div class="champ">
      <label for="email">Adresse email</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="champ">
      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" autocomplete="current-password" required>
    </div>
    <button class="btn" style="width:100%" type="submit" id="btn-connexion">Se connecter</button>
  </form>
</div>

<!-- ================= APPLICATION ================= -->
<div id="app" hidden>
  <header>
    <h1>Suivi fournisseurs</h1>
    <span class="id" id="qui"></span>
    <button class="btn mini creux" id="btn-deconnexion"
            style="background:#fff;border-color:#fff">Se déconnecter</button>
  </header>
  <nav>
    <button data-vue="alertes" aria-current="page">À surveiller</button>
    <button data-vue="fournisseurs">Fournisseurs</button>
    <button data-vue="actions">Actions</button>
    <button data-vue="donnees">Données</button>
  </nav>
  <main>
    <div id="vue-alertes"></div>
    <div id="vue-fournisseurs" hidden></div>
    <div id="vue-actions" hidden></div>
    <div id="vue-donnees" hidden></div>
    <div id="vue-fiche" hidden></div>
  </main>
</div>

<dialog id="modal">
  <form method="dialog" id="form-modal">
    <div class="tete" id="modal-titre"></div>
    <div class="corps" id="modal-corps"></div>
    <div class="pied">
      <button class="btn creux" value="annuler" type="submit">Annuler</button>
      <button class="btn" id="modal-valider" type="button">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* =====================================================================
   1. CONFIGURATION - à remplir une seule fois
   Supabase > Project Settings > API
   L'URL et la clé anon sont publiques par nature. Ce qui protège les
   données, c'est la RLS du fichier schema.sql, pas le secret de la clé.
   ===================================================================== */
const SUPABASE_URL = 'https://hkgmrfcyogepmclmjwnx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZ21yZmN5b2dlcG1jbG1qd254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTkzOTgsImV4cCI6MjEwMjUzNTM5OH0.gTrlyCgZOiVSWS6GuVRHyopGs3Zzg2tMITvzkdSIdFI';

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================================
   2. Référentiels de saisie
   ===================================================================== */
const TYPES        = ['National','Régional','Mixte'];
const SOURCES      = ['BAN Teract','PDF','Excel','Papier','Autre'];
const FLUX         = ['STOCKE','AG','STOCKE/AG','DIRECT'];
const ETATS        = ['SAISI','PAS DE MODIF','NON TRAITE','A FAIRE','A SAISIR','NE PAS SAISIR',
                      'ATT FRS TARIFS','ATT BAN','EN ATT MARION'];
const DIFFUSIONS   = ['DIFFUSÉ','DIFFUSÉ AVEC MAJ G','NE PAS DIFFUSER','CLÔTURÉ SANS INFO'];
const MODES        = ['Échéance prévisible','Surveillance ancienneté'];
const STATUTS      = ['Actif','En veille','Clos'];
const CONDITIONS_T = ['Remise sur facture','RFA','Franco','Escompte','Promotion','Autre'];
const EVENEMENTS   = ['Réception tarif','Relance','Négociation','Litige','Note','Décision'];
const SUITES       = ['À faire','Fait','Sans suite'];

const CHAMPS_FOURNISSEUR = [
  {k:'code',            l:'Code fournisseur', t:'text', req:true,
   aide:'Reprendre le code de l\'ERP à l\'identique.'},
  {k:'raison_sociale',  l:'Raison sociale', t:'text', req:true},
  {k:'type',            l:'Type', t:'select', o:TYPES},
  {k:'source_tarif',    l:'Source du tarif', t:'select', o:SOURCES},
  {k:'flux_logistique', l:'Flux logistique', t:'select', o:FLUX},
  {k:'famille',         l:'Famille ou activité', t:'text'},
  {k:'mode_suivi',      l:'Mode de suivi', t:'select', o:MODES,
   aide:'Échéance prévisible : vous saisissez la date de révision. Surveillance ancienneté : elle est calculée depuis le dernier tarif reçu.'},
  {k:'periodicite_mois',l:'Périodicité attendue (mois)', t:'number'},
  {k:'prochaine_revision', l:'Prochaine révision attendue', t:'date'},
  {k:'contact',         l:'Contact commercial', t:'text'},
  {k:'email',           l:'Email', t:'email'},
  {k:'telephone',       l:'Téléphone', t:'text'},
  {k:'franco',          l:'Franco (€)', t:'number'},
  {k:'mini_commande',   l:'Mini de commande (€)', t:'number'},
  {k:'delai_livraison', l:'Délai de livraison (jours)', t:'number'},
  {k:'statut',          l:'Statut', t:'select', o:STATUTS},
  {k:'commentaire',     l:'Commentaire', t:'textarea'},
];

const CHAMPS_TARIF = [
  {k:'reference',       l:'Référence de la version', t:'text', aide:'Par exemple : Tarif 2026, ou Avenant mars 2026.'},
  {k:'date_application',l:'Date d\'application', t:'date', req:true,
   aide:'Date à laquelle le tarif fournisseur prend effet.'},
  {k:'date_reception',  l:'Date de réception', t:'date'},
  {k:'fin_annoncee',    l:'Fin de validité annoncée', t:'date',
   aide:'Terme communiqué par le fournisseur. Indicatif : la fin réelle reste déduite de la version suivante.'},
  {k:'source',          l:'Source', t:'select', o:SOURCES},
  {k:'etat',            l:'État', t:'select', o:ETATS},
  {k:'evolution',       l:'Évolution moyenne achat (%)', t:'number', aide:'Saisir 3.2 pour une hausse de 3,2 %.'},
  {k:'evolution_pc',    l:'Évolution moyenne PC (%)', t:'number'},
  {k:'evolution_pvgc',  l:'Évolution moyenne PVGC (%)', t:'number'},
  {k:'envoi_resp',      l:'Envoi responsable', t:'date'},
  {k:'retour_resp',     l:'Retour responsable', t:'date'},
  {k:'maj_sap',         l:'MAJ SAP', t:'date'},
  {k:'diffusion',       l:'Diffusion', t:'select', o:DIFFUSIONS},
  {k:'date_diffusion',  l:'Date de diffusion', t:'date'},
  {k:'specificites',    l:'Spécificités', t:'text'},
  {k:'lien',            l:'Lien vers le document', t:'text'},
  {k:'commentaire',     l:'Commentaire', t:'textarea'},
];

const CHAMPS_CONDITION = [
  {k:'type_condition', l:'Type de condition', t:'select', o:CONDITIONS_T, req:true},
  {k:'valeur',         l:'Valeur', t:'number'},
  {k:'unite',          l:'Unité', t:'select', o:['%','€']},
  {k:'date_debut',     l:'Date de début', t:'date'},
  {k:'date_fin',       l:'Date de fin', t:'date', aide:'Laisser vide si la condition court sans terme.'},
  {k:'base_calcul',    l:'Base de calcul', t:'text'},
  {k:'document',       l:'Document de référence', t:'text'},
];

const CHAMPS_JOURNAL = [
  {k:'date',           l:'Date', t:'date', req:true},
  {k:'type_evenement', l:'Type d\'événement', t:'select', o:EVENEMENTS},
  {k:'objet',          l:'Objet', t:'text', req:true},
  {k:'detail',         l:'Détail', t:'textarea'},
  {k:'suite',          l:'Suite à donner', t:'text'},
  {k:'echeance',       l:'Échéance', t:'date'},
  {k:'statut',         l:'Statut', t:'select', o:SUITES},
];

/* =====================================================================
   3. Utilitaires
   ===================================================================== */
const $ = s => document.querySelector(s);
const AUJ = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const jour = s => { if(!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d)?null:d; };
const iso  = d => d ? d.toISOString().slice(0,10) : null;
const fr   = s => { const d = jour(s); return d ? d.toLocaleDateString('fr-FR') : '-'; };
const ecart = d => Math.round((d - AUJ())/86400000);
const moisPlus = (d,n) => { const r = new Date(d); const j = r.getDate();
  r.setMonth(r.getMonth()+Number(n)); if(r.getDate()<j) r.setDate(0); return r; };
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nb = v => (v===null||v===undefined||v==='') ? null : Number(v);

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(()=>t.hidden = true, 2600);
}

/* =====================================================================
   4. État
   ===================================================================== */
let D = { fournisseurs:[], tarifs:[], conditions:[], journal:[] };
let vueCourante = 'alertes';
let ficheOuverte = null;

// Supabase plafonne une lecture à 1000 lignes. On pagine pour tout récupérer.
async function tout(table, tri, croissant = true){
  const PAGE = 1000;
  let lignes = [], depart = 0;
  for(;;){
    const r = await db.from(table).select('*')
      .order(tri, {ascending:croissant})
      .range(depart, depart + PAGE - 1);
    if(r.error) throw r.error;
    lignes = lignes.concat(r.data);
    if(r.data.length < PAGE) return lignes;
    depart += PAGE;
  }
}

async function charger(){
  const [f,t,c,j] = await Promise.all([
    tout('fournisseurs', 'raison_sociale'),
    tout('tarifs', 'date_application'),
    tout('conditions', 'date_debut'),
    tout('journal', 'date', false),
  ]);
  D = { fournisseurs:f, tarifs:t, conditions:c, journal:j };
}

/* =====================================================================
   5. Règles métier
   ===================================================================== */

// Versions tarifaires d'un fournisseur, triées, avec fin déduite et statut.
function versions(fid){
  const v = D.tarifs.filter(t => t.fournisseur_id === fid)
    .sort((a,b) => a.date_application.localeCompare(b.date_application));
  return v.map((t,i) => {
    const debut = jour(t.date_application);
    const suiv  = v[i+1] ? jour(v[i+1].date_application) : null;
    const fin   = suiv ? new Date(suiv.getTime()-86400000) : null;
    let statut = 'Périmé';
    if(debut > AUJ())                    statut = 'À venir';
    else if(!fin || fin >= AUJ())        statut = 'En vigueur';
    return {...t, debut, fin, statut};
  });
}

// Situation d'un fournisseur : dernier tarif, échéance, alerte.
function situation(f){
  const v = versions(f.id);
  const enCours = [...v].reverse().find(x => x.debut <= AUJ()) || null;
  let echeance = null;
  if(f.mode_suivi === 'Échéance prévisible'){
    echeance = jour(f.prochaine_revision);
  } else if(enCours && f.periodicite_mois){
    echeance = moisPlus(enCours.debut, f.periodicite_mois);
  }
  const jours = echeance ? ecart(echeance) : null;
  let niveau = 'ok', verdict = 'À jour';
  if(!enCours){
    niveau = 'sans-tarif'; verdict = 'Aucun tarif enregistré';
  } else if(echeance === null){
    niveau = 'sans-echeance'; verdict = 'Pas d\'échéance définie';
  } else if(jours < 0){
    niveau = 'retard';  verdict = `Attendu depuis ${Math.abs(jours)} j`;
  } else if(jours <= 30){
    niveau = 'surveiller'; verdict = `Dans ${jours} j`;
  } else {
    verdict = `Dans ${jours} j`;
  }
  return {f, versions:v, enCours, echeance, jours, niveau, verdict};
}

const RANG = {retard:0, surveiller:1, 'sans-tarif':2, 'sans-echeance':3, ok:4};

// Un tarif est à traiter s'il s'applique bientôt ou déjà et n'a pas été diffusé.
const HORS_CIRCUIT = ['NE PAS SAISIR','PAS DE MODIF'];
function aTraiter(){
  const limite = new Date(AUJ().getTime() + 15*86400000);
  const noms = Object.fromEntries(D.fournisseurs.map(f => [f.id, f]));
  return D.tarifs
    .filter(t => {
      const d0 = jour(t.date_application);
      if(!d0 || d0 > limite) return false;
      if(t.diffusion) return false;
      if(HORS_CIRCUIT.includes(t.etat)) return false;
      return true;
    })
    .map(t => ({...t, debut:jour(t.date_application), frs:noms[t.fournisseur_id]}))
    .filter(t => t.frs)
    .sort((a,b) => a.debut - b.debut);
}

// Résumé lisible du circuit de traitement d'une version tarifaire.
function circuit(v){
  const etapes = [];
  if(v.etat) etapes.push('État : ' + esc(v.etat));
  if(v.envoi_resp)  etapes.push('envoi resp. ' + fr(v.envoi_resp));
  if(v.retour_resp) etapes.push('retour ' + fr(v.retour_resp));
  if(v.maj_sap){
    const j = delaiSAP(v);
    etapes.push('SAP ' + fr(v.maj_sap) + (j === null ? '' :
      j < 0 ? ` (${Math.abs(j)} j d'avance)` : j === 0 ? ' (le jour même)' : ` (${j} j de retard)`));
  }
  etapes.push(v.diffusion
    ? esc(v.diffusion) + (v.date_diffusion ? ' le ' + fr(v.date_diffusion) : '')
    : '<b>non diffusé</b>');
  return etapes.join(' · ');
}

// Délai entre l'application du tarif et sa saisie dans SAP. Négatif = saisi en avance.
function delaiSAP(t){
  const a = jour(t.date_application), b = jour(t.maj_sap);
  return (a && b) ? Math.round((b - a)/86400000) : null;
}

function situations(){
  return D.fournisseurs

    .sort((a,b) => RANG[a.niveau]-RANG[b.niveau]
      || (a.jours ?? 99999)-(b.jours ?? 99999)
      || a.f.raison_sociale.localeCompare(b.f.raison_sociale));
}

// Description des tables pour l'import comme pour l'export.
const TABLES = {
  fournisseurs: {l:'Fournisseurs', champs:CHAMPS_FOURNISSEUR, cle:'code'},
  tarifs:       {l:'Tarifs',       champs:CHAMPS_TARIF,      lien:true},
  conditions:   {l:'Conditions',   champs:CHAMPS_CONDITION,  lien:true},
  journal:      {l:'Journal',      champs:CHAMPS_JOURNAL,    lien:true},
};

const sansAccent = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]/g,'');

// Colonnes exportées : le code fournisseur remplace l'identifiant technique.
function colonnes(table){
  const d = TABLES[table];
  const base = d.champs.map(c => ({k:c.k, l:c.l}));
  return d.lien ? [{k:'code_fournisseur', l:'Code fournisseur'}, ...base] : base;
}

/* ---------- export ---------- */
function versCSV(table){
  const cols = colonnes(table);
  const codes = Object.fromEntries(D.fournisseurs.map(f => [f.id, f.code]));
  const lignes = D[table].map(r => cols.map(c => {
    let v = c.k === 'code_fournisseur' ? codes[r.fournisseur_id] : r[c.k];
    if(v === null || v === undefined) return '';
    v = String(v);
    return /[";\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(';'));
  return '\uFEFF' + cols.map(c => c.l).join(';') + '\n' + lignes.join('\n');
}

function telecharger(nom, contenu, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenu], {type:type}));
  a.download = nom;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const horodatage = () => new Date().toISOString().slice(0,10).replace(/-/g,'');

/* ---------- lecture d'un CSV ---------- */
function lireCSV(texte){
  texte = texte.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const premiere = texte.split('\n')[0];
  const sep = (premiere.split(';').length >= premiere.split(',').length) ? ';' : ',';
  const lignes = [];
  let champ = '', ligne = [], guillemets = false;
  for(let i = 0; i < texte.length; i++){
    const c = texte[i];
    if(guillemets){
      if(c === '"' && texte[i+1] === '"'){ champ += '"'; i++; }
      else if(c === '"') guillemets = false;
      else champ += c;
    } else if(c === '"') guillemets = true;
    else if(c === sep){ ligne.push(champ); champ = ''; }
    else if(c === '\n'){ ligne.push(champ); lignes.push(ligne); ligne = []; champ = ''; }
    else champ += c;
  }
  if(champ !== '' || ligne.length){ ligne.push(champ); lignes.push(ligne); }
  return lignes.filter(l => l.some(v => v.trim() !== ''));
}

// Conversions tolérantes : dates françaises, décimales à la virgule.
function versDate(v){
  v = String(v).trim();
  if(!v) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(!m) return null;
  const an = m[3].length === 2 ? '20'+m[3] : m[3];
  return `${an}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function versNombre(v){
  v = String(v).replace(/[€%\s\u00A0]/g,'').replace(',','.').trim();
  if(v === '') return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

/* ---------- import ---------- */
async function importer(table, texte){
  const d = TABLES[table];
  const cols = colonnes(table);
  const lignes = lireCSV(texte);
  if(lignes.length < 2) return {erreurs:['Le fichier ne contient pas de données sous l\'en-tête.']};

  // Correspondance des en-têtes : libellé français ou nom de colonne technique.
  const index = {};
  const inconnues = [];
  lignes[0].forEach((titre, i) => {
    const t = sansAccent(titre);
    const col = cols.find(c => sansAccent(c.l) === t || sansAccent(c.k) === t);
    if(col) index[col.k] = i; else if(titre.trim()) inconnues.push(titre.trim());
  });

  const obligatoire = d.lien ? 'code_fournisseur' : 'code';
  if(index[obligatoire] === undefined)
    return {erreurs:[`Colonne « ${d.lien ? 'Code fournisseur' : 'Code fournisseur'} » absente du fichier.`]};

  const parCode = Object.fromEntries(D.fournisseurs.map(f => [f.code.trim().toLowerCase(), f.id]));
  const type = Object.fromEntries(d.champs.map(c => [c.k, c.t]));
  const rangs = [], erreurs = [];

  lignes.slice(1).forEach((l, n) => {
    const numero = n + 2;
    const obj = {};
    if(d.lien){
      const code = (l[index.code_fournisseur] || '').trim().toLowerCase();
      const id = parCode[code];
      if(!id){ erreurs.push(`Ligne ${numero} : code fournisseur « ${l[index.code_fournisseur]||''} » introuvable.`); return; }
      obj.fournisseur_id = id;
    }
    for(const c of cols){
      if(c.k === 'code_fournisseur' || index[c.k] === undefined) continue;
      const brut = (l[index[c.k]] ?? '').trim();
      if(brut === ''){ obj[c.k] = null; continue; }
      if(type[c.k] === 'date'){
        const dt = versDate(brut);
        if(!dt){ erreurs.push(`Ligne ${numero} : date « ${brut} » illisible dans la colonne ${c.l}.`); return; }
        obj[c.k] = dt;
      }
      else if(type[c.k] === 'number') obj[c.k] = versNombre(brut);
      else obj[c.k] = brut;
    }
    if(table === 'fournisseurs' && !obj.code){ erreurs.push(`Ligne ${numero} : code fournisseur vide.`); return; }
    if(table === 'tarifs' && !obj.date_application){ erreurs.push(`Ligne ${numero} : date d'application manquante.`); return; }
    if(table === 'journal' && !obj.objet){ erreurs.push(`Ligne ${numero} : objet manquant.`); return; }
    rangs.push(obj);
  });

  let enregistres = 0;
  for(let i = 0; i < rangs.length; i += 100){
    const lot = rangs.slice(i, i+100);
    const r = d.cle
      ? await db.from(table).upsert(lot, {onConflict:d.cle})
      : await db.from(table).insert(lot);
    if(r.error){ erreurs.push(`Enregistrement interrompu : ${r.error.message}`); break; }
    enregistres += lot.length;
  }
  return {enregistres, erreurs, inconnues, total:lignes.length - 1};
}

      <div class="champ">

      </div>
      <div class="champ">

    </div>

    <div class="liste" style="padding:16px">
      <p style="margin:0 0 10px"><b>Fournisseurs</b> : l'import met à jour les fiches existantes en se basant sur le code.
      Réimporter un fichier corrigé ne crée pas de doublon.</p>
      <p style="margin:0 0 10px"><b>Tarifs, conditions, journal</b> : chaque import ajoute des lignes.
      Importer deux fois le même fichier créera des doublons.</p>

}

/* ---------- fusion de deux fiches ---------- */
// Rattache tarifs, conditions et journal à la fiche cible, puis supprime la source.
async function fusionner(source){
  const autres = D.fournisseurs.filter(f => f.id !== source.id)
    .sort((a,b) => a.raison_sociale.localeCompare(b.raison_sociale));
  if(!autres.length){ toast('Aucune autre fiche disponible'); return; }

  $('#modal-titre').textContent = 'Fusionner ' + source.raison_sociale;
  $('#modal-corps').innerHTML = `
    <p style="margin:0 0 16px">Tous les tarifs, conditions et échanges de
      <b>${esc(source.raison_sociale)}</b> (${esc(source.code)}) seront rattachés à la fiche choisie.
      Cette fiche sera ensuite supprimée.</p>
    <div class="champ">
      <label for="cible">Fiche à conserver</label>
      <select id="cible">
        <option value="">-</option>
        ${autres.map(f => `<option value="${f.id}">${esc(f.raison_sociale)} (${esc(f.code)})</option>`).join('')}
      </select>
      <div class="aide">Les compteurs de la fiche conservée sont recalculés après la fusion.</div>
    </div>
    <div class="message erreur">Opération irréversible. Faites d'abord une sauvegarde
      depuis l'onglet Données si vous avez un doute.</div>`;

  const b = $('#modal-valider');
  b.replaceWith(b.cloneNode(true));
  $('#modal-valider').textContent = 'Fusionner';
  $('#modal-valider').addEventListener('click', async () => {
    const cible = $('#cible').value;
    if(!cible){ toast('Choisir la fiche à conserver'); return; }
    const nom = D.fournisseurs.find(f => f.id === cible).raison_sociale;
    if(!confirm(`Rattacher tout l'historique de ${source.raison_sociale} à ${nom}, `
      + `puis supprimer ${source.raison_sociale} ?`)) return;
    try{
      for(const t of ['tarifs','conditions','journal']){
        const r = await db.from(t).update({fournisseur_id:cible}).eq('fournisseur_id', source.id);
        if(r.error) throw r.error;
      }
      const r = await db.from('fournisseurs').delete().eq('id', source.id);
      if(r.error) throw r.error;
      await charger();
      $('#modal').close();
      $('#modal-valider').textContent = 'Enregistrer';
      toast('Fusion effectuée');
      ficheOuverte = cible;
      dessinerFiche();
    }catch(e){
      toast('Fusion impossible : ' + e.message);
    }
  });
  $('#modal').showModal();
}

/* =====================================================================
   7. Formulaire générique
   ===================================================================== */
function formulaire({titre, champs, table, valeurs={}, id=null, fixe={}, apres}){
  $('#modal-titre').textContent = titre;
  $('#modal-corps').innerHTML = champs.map(c => {
    const v = valeurs[c.k] ?? '';
    const aide = c.aide ? `<div class="aide">${c.aide}</div>` : '';
    let saisie;
    if(c.t === 'select'){
      const opts = c.o.map(o => typeof o === 'string' ? {v:o, l:o} : o);
      saisie = `<select id="c-${c.k}" ${c.req?'required':''}>
        <option value="">-</option>
        ${opts.map(o => `<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}
      </select>`;
    } else if(c.t === 'textarea'){
      saisie = `<textarea id="c-${c.k}">${esc(v)}</textarea>`;
    } else {
      saisie = `<input type="${c.t}" id="c-${c.k}" value="${esc(v)}"
        ${c.t==='number'?'step="any"':''} ${c.req?'required':''}>`;
    }
    return `<div class="champ"><label for="c-${c.k}">${c.l}${c.req?' *':''}</label>${saisie}${aide}</div>`;
  }).join('');

  const valider = async () => {
    const data = {...fixe};
    for(const c of champs){
      let v = $('#c-'+c.k).value.trim();
      if(c.req && !v){ toast('Le champ « '+c.l+' » est obligatoire'); $('#c-'+c.k).focus(); return; }
      data[c.k] = (c.t === 'number') ? nb(v) : (v === '' ? null : v);
    }
    try{
      await enregistrer(table, data, id);
      await charger();
      $('#modal').close();
      toast(id ? 'Modifications enregistrées' : 'Enregistré');
      apres && apres();
    }catch(e){
      toast(messageErreur(e));
    }
  };
  const bouton = $('#modal-valider');
  bouton.replaceWith(bouton.cloneNode(true));
  $('#modal-valider').textContent = 'Enregistrer';
  $('#modal-valider').addEventListener('click', valider);
  $('#modal').showModal();
}

async function enregistrer(table, data, id){
  const r = id ? await db.from(table).update(data).eq('id', id)
               : await db.from(table).insert(data);
  if(r.error) throw r.error;
}

function messageErreur(e){
  const m = e?.message || '';
  if(m.includes('duplicate key')) return 'Ce code fournisseur existe déjà.';
  if(m.includes('violates row-level security')) return 'Session expirée. Se reconnecter.';
  return 'Enregistrement impossible : ' + m;
}

/* =====================================================================
   8. Connexion et démarrage
   ===================================================================== */
$('#form-connexion').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btn-connexion'); b.disabled = true; b.textContent = 'Connexion...';
  const {error} = await db.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#mdp').value});
  b.disabled = false; b.textContent = 'Se connecter';
  if(error){
    const z = $('#erreur-connexion');
    const m = (error.message || '').toLowerCase();
    let explication;
    if(m.includes('not confirmed'))
      explication = 'Adresse non confirmée. Dans Supabase, Authentication > Users, ouvrir l\'utilisateur et le confirmer, ou le recréer en cochant Auto Confirm User.';
    else if(m.includes('disabled') || m.includes('not enabled'))
      explication = 'La connexion par email est désactivée sur le projet. Réactiver le fournisseur Email dans Authentication, en ne désactivant que les inscriptions.';
    else if(m.includes('rate limit'))
      explication = 'Trop de tentatives. Attendre quelques minutes.';
    else if(m.includes('failed to fetch') || m.includes('network'))
      explication = 'Projet Supabase injoignable. Vérifier l\'URL et la connexion réseau.';
    else
      explication = 'Vérifier l\'adresse et le mot de passe, sans espace avant ou après.';
    z.innerHTML = explication + '<br><small style="opacity:.75">Message Supabase : '
      + (error.message || 'inconnu') + (error.code ? ' (' + error.code + ')' : '') + '</small>';
    z.hidden = false;
  }
});

$('#btn-deconnexion').addEventListener('click', async () => {
  await db.auth.signOut(); location.reload();
});

document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => afficher(b.dataset.vue)));

async function demarrer(session){
  $('#connexion').hidden = true;
  $('#app').hidden = false;
  $('#qui').textContent = session.user.email;
  try{
    await charger();
    afficher('alertes');
  }catch(e){
    $('main').innerHTML = `<div class="message erreur">Lecture des données impossible : ${esc(e.message)}
      <br>Vérifier que le script schema.sql a bien été exécuté dans Supabase.</div>`;
  }
}

db.auth.getSession().then(({data}) => { if(data.session) demarrer(data.session); });
db.auth.onAuthStateChange((ev, session) => {
  if(ev === 'SIGNED_IN' && session) demarrer(session);
});
